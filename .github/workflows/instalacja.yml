name: Instalacja i publikacja

# Zakłada bazę, wgrywa przepisy, wdraża generator przepisów i publikuje aplikację.
# Uruchom ręcznie (Actions → Instalacja i publikacja → Run workflow). Odpala się też po każdej zmianie kodu.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: instalacja
  cancel-in-progress: false

jobs:
  instalacja:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    env:
      SUPABASE_PROJECT: ${{ secrets.SUPABASE_PROJECT }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      KOD_DOMU: ${{ secrets.KOD_DOMU }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalacja bibliotek
        run: npm install --no-audit --no-fund --omit=optional
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: Baza, konto domu, przepisy
        run: node scripts/setup.mjs
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Generator przepisów
        if: env.ANTHROPIC_API_KEY != ''
        run: |
          REF=$(echo "$SUPABASE_PROJECT" | grep -oE '[a-z0-9]{20}' | head -1)
          supabase functions deploy generate-recipes --project-ref "$REF" --use-api || supabase functions deploy generate-recipes --project-ref "$REF"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Publikacja aplikacji
        id: pages
        uses: actions/deploy-pages@v4
      - name: Adres aplikacji
        run: |
          echo "### Aplikacja jest gotowa: ${{ steps.pages.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Otwórz ten adres w Safari na iPhonie → Udostępnij → Do ekranu początkowego." >> "$GITHUB_STEP_SUMMARY"
