name: Instalacja i publikacja

# Zakłada bazę, wgrywa przepisy i publikuje aplikację.
# Uruchom ręcznie (Actions → Instalacja i publikacja → Run workflow). Odpala się też po każdej zmianie kodu aplikacji.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["przepisy/**", "dane/**", "*.md", ".keepalive"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: instalacja
  cancel-in-progress: false

jobs:
  instalacja:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    env:
      SUPABASE_PROJECT: ${{ secrets.SUPABASE_PROJECT }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      KOD_DOMU: ${{ secrets.KOD_DOMU }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalacja bibliotek
        run: npm install --no-audit --no-fund --omit=optional
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: Baza, konto domu, przepisy
        run: node scripts/setup.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Publikacja aplikacji
        id: pages
        uses: actions/deploy-pages@v4
      - name: Adres aplikacji
        run: |
          echo "### Aplikacja jest gotowa: ${{ steps.pages.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Otwórz ten adres w Safari na iPhonie → Udostępnij → Do ekranu początkowego." >> "$GITHUB_STEP_SUMMARY"
