name: Publikacja aplikacji

# Publikuje aplikację (folder web/) na GitHub Pages. Bez sekretów.
on:
  push:
    branches: [main]
    paths: ["web/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publikacja:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: pages
        uses: actions/deploy-pages@v4
      - name: Adres aplikacji
        run: echo "### Aplikacja ${{ steps.pages.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
