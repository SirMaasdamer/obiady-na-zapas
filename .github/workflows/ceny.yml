name: Ceny z gazetek

# Pobiera oferty i gazetki Biedronki, Lidla i Kauflandu i zapisuje promocje w bazie (za darmo, bez AI).
# Automatycznie w poniedziałki i czwartki rano oraz po każdej instalacji. Można też uruchomić ręcznie.
on:
  schedule:
    - cron: "30 4 * * 1,4"
  workflow_dispatch:
    inputs:
      stores:
        description: "Sklepy (b = Biedronka, l = Lidl, k = Kaufland)"
        default: "b,l,k"
  workflow_run:
    workflows: ["Instalacja i publikacja"]
    types: [completed]

permissions:
  contents: write

jobs:
  ceny:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_PROJECT: ${{ secrets.SUPABASE_PROJECT }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      STORES: ${{ inputs.stores || 'b,l,k' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Darmowe narzędzia do odczytu PDF i OCR
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-pol
      - name: Pobieranie i odczyt gazetek
        run: node scripts/scrape.mjs
      - name: Zapis promocji w repozytorium (dla Claude przy układaniu przepisów)
        # przy okazji podtrzymuje harmonogram: GitHub wyłącza go po 60 dniach bez zmian w repozytorium
        if: always()
        run: |
          git config user.name "obiady-bot"; git config user.email "bot@users.noreply.github.com"
          git add dane/promocje.json 2>/dev/null || true
          if ! git diff --cached --quiet; then git commit -m "Promocje $(date +%F)" && git pull --rebase -q && git push; fi
