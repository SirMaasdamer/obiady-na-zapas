name: Ceny z gazetek

# Pobiera oferty i gazetki Biedronki, Lidla i Kauflandu, zapisuje je w dane/oferty.json
# i prosi bazę o synchronizację. Za darmo, bez AI i bez sekretów.
on:
  schedule:
    - cron: "30 4 * * 1,4"
  workflow_dispatch:
    inputs:
      stores:
        description: "Sklepy (b = Biedronka, l = Lidl, k = Kaufland)"
        default: "b,l,k"

permissions:
  contents: write

concurrency:
  group: dane
  cancel-in-progress: false

jobs:
  ceny:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      STORES: ${{ inputs.stores || 'b,l,k' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Darmowe narzędzia do odczytu PDF i OCR
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-pol
      - name: Pobieranie i odczyt ofert
        run: node scripts/scrape.mjs
      - name: Zapis w repozytorium i synchronizacja bazy
        if: always()
        run: |
          git config user.name "obiady-bot"; git config user.email "bot@users.noreply.github.com"
          git add dane/oferty.json
          if ! git diff --cached --quiet; then git commit -q -m "Oferty $(date +%F)" && git pull -q --rebase && git push -q; fi
          bash scripts/sync.sh
