name: Ceny z gazetek

# Pobiera gazetki Biedronki, Lidla i Kauflandu i zapisuje promocje w bazie.
# Automatycznie w poniedziałki i czwartki rano oraz po każdej instalacji. Można też uruchomić ręcznie.
on:
  schedule:
    - cron: "30 4 * * 1,4"
  workflow_dispatch:
    inputs:
      stores:
        description: "Sklepy (b = Biedronka, l = Lidl, k = Kaufland)"
        default: "b,l,k"
      force:
        description: "Odczytaj ponownie gazetki już odczytane"
        type: boolean
        default: false
  workflow_run:
    workflows: ["Instalacja i publikacja"]
    types: [completed]

permissions:
  contents: write

jobs:
  ceny:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_PROJECT: ${{ secrets.SUPABASE_PROJECT }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      STORES: ${{ inputs.stores || 'b,l,k' }}
      FORCE: ${{ inputs.force || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Pobieranie i odczyt gazetek
        run: node scripts/scrape.mjs
      - name: Podtrzymanie harmonogramu
        # GitHub wyłącza harmonogram po 60 dniach bez zmian w repozytorium
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45*86400 )) ]; then
            git config user.name "obiady-bot"; git config user.email "bot@users.noreply.github.com"
            date -u +%F > .keepalive && git add .keepalive && git commit -m "Podtrzymanie harmonogramu" && git push
          fi
