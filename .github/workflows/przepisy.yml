name: Nowe przepisy

# Gdy w folderze przepisy/ (albo seed/) pojawią się zmiany: sprawdza je, buduje dane/katalog.json
# i prosi bazę o synchronizację. Bez sekretów.
on:
  push:
    branches: [main]
    paths: ["przepisy/**", "seed/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dane
  cancel-in-progress: false

jobs:
  przepisy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Sprawdzenie i budowa katalogu
        run: node scripts/import-recipes.mjs
      - name: Zapis w repozytorium i synchronizacja bazy
        run: |
          git config user.name "obiady-bot"; git config user.email "bot@users.noreply.github.com"
          git add dane/katalog.json
          if ! git diff --cached --quiet; then git commit -q -m "Katalog przepisów" && git pull -q --rebase && git push -q; fi
          bash scripts/sync.sh
